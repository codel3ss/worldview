name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run build

      # The smoke test drives the built app in headless Chromium with WebGL.
      # It forces the zero-network "void" globe, so no feed or API key is needed.
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
